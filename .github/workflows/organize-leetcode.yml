name: Organize LeetCode Solutions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    # GitHub Action ke apne commit par dobara processing nahi hogi
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Organize LeetCode solutions and update README
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = Get-Location

          # Language folders create karo
          New-Item -ItemType Directory -Force -Path "Python" | Out-Null
          New-Item -ItemType Directory -Force -Path "Java" | Out-Null
          New-Item -ItemType Directory -Force -Path "C++" | Out-Null

          # Root-level LeetSync folders ko organize karo
          $rootFolders = Get-ChildItem -Directory | Where-Object {
              $_.Name -match '^\d+\s+'
          }

          foreach ($folder in $rootFolders) {

              $files = Get-ChildItem $folder.FullName -Recurse -File |
                  Where-Object {
                      $_.Extension -in @(".py", ".java", ".cpp", ".cc", ".cxx")
                  }

              if ($files.Count -eq 0) {
                  continue
              }

              $file = $files[0]

              switch ($file.Extension.ToLower()) {
                  ".py" {
                      $language = "Python"
                      $solutionName = "solution.py"
                  }
                  ".java" {
                      $language = "Java"
                      $solutionName = "Solution.java"
                  }
                  ".cpp" {
                      $language = "C++"
                      $solutionName = "solution.cpp"
                  }
                  ".cc" {
                      $language = "C++"
                      $solutionName = "solution.cpp"
                  }
                  ".cxx" {
                      $language = "C++"
                      $solutionName = "solution.cpp"
                  }
                  default {
                      continue
                  }
              }

              # Problem number aur title nikalo
              if ($folder.Name -match '^(\d+)\s+(.+)$') {
                  $number = [int]$matches[1]
                  $title = $matches[2]
              }
              else {
                  continue
              }

              # Folder slug banao
              $slug = $title.ToLower()
              $slug = $slug -replace '[^a-z0-9]+', '-'
              $slug = $slug.Trim('-')

              $problemFolder = "{0:D4}-{1}" -f $number, $slug
              $destination = Join-Path $root "$language\$problemFolder"

              New-Item -ItemType Directory -Force -Path $destination | Out-Null

              $destinationFile = Join-Path $destination $solutionName

              Copy-Item $file.FullName $destinationFile -Force

              # Old root-level folder delete
              Remove-Item $folder.FullName -Recurse -Force
          }

          # README statistics
          $pythonCount = @(Get-ChildItem "Python" -Recurse -File -Filter "*.py").Count
          $javaCount = @(Get-ChildItem "Java" -Recurse -File -Filter "*.java").Count
          $cppCount = @(
              Get-ChildItem "C++" -Recurse -File |
              Where-Object { $_.Extension -in @(".cpp", ".cc", ".cxx") }
          ).Count

          $total = $pythonCount + $javaCount + $cppCount

          $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

          $readme = @"
          # LeetCode Solutions

          My LeetCode solutions automatically synced from LeetCode to GitHub.

          ## 📊 Progress

          | Language | Solved |
          |---|---:|
          | 🐍 Python | $pythonCount |
          | ☕ Java | $javaCount |
          | ⚡ C++ | $cppCount |
          | **Total** | **$total** |

          ## 📁 Repository Structure

          ``````
          LeetCode-Solutions/
          ├── Python/
          │   ├── 0001-two-sum/
          │   │   └── solution.py
          │   └── ...
          ├── Java/
          │   └── ...
          ├── C++/
          │   └── ...
          └── README.md
          ``````

          ## 🔄 Automatic Sync

          New accepted LeetCode submissions are automatically synced to this repository.

          **Last updated:** $date
          "@

          Set-Content -Path "README.md" -Value $readme -Encoding UTF8

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto organize LeetCode solutions [skip ci]"
          git push