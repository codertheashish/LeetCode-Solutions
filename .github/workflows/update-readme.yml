name: Update LeetCode README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          root = Path(".")

          files = [
              p for p in root.rglob("*")
              if p.is_file()
              and ".git" not in p.parts
              and ".github" not in p.parts
              and p.name != "README.md"
          ]

          python_count = sum(
              p.suffix.lower() == ".py" for p in files
          )

          java_count = sum(
              p.suffix.lower() == ".java" for p in files
          )

          cpp_count = sum(
              p.suffix.lower() in {".cpp", ".cc", ".cxx"}
              for p in files
          )

          total = python_count + java_count + cpp_count

          now = datetime.now(
              ZoneInfo("Asia/Kolkata")
          ).strftime("%Y-%m-%d %H:%M:%S IST")

          readme = f"""# LeetCode Solutions

My LeetCode solutions automatically synced from LeetCode to GitHub.

## Progress

| Language | Solved |
|---|---:|
| Python | {python_count} |
| Java | {java_count} |
| C++ | {cpp_count} |
| **Total** | **{total}** |

## Automatic Sync

New accepted LeetCode submissions are automatically synced to this repository.

Last updated: {now}
"""

          Path("README.md").write_text(
              readme,
              encoding="utf-8"
          )

      - name: Commit README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README already up to date."
            exit 0
          fi

          git commit -m "Update LeetCode progress"
          git push